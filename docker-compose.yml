# Default = DEV. Local development with live-reload.
# The app runs on a stock node image with the source bind-mounted — no build step,
# no Dockerfile needed here. Production lives in docker-compose.prod.yml (uses Dockerfile).
services:

  mongodb:
    image: mongo:6
    container_name: s2s-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - s2s-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: node:22-bookworm-slim
    container_name: s2s-backend
    restart: unless-stopped
    working_dir: /app
    env_file: .env
    environment:
      NODE_ENV: development
      HUSKY: "0"            # skip husky git-hook install during `npm install`
    # Install deps into the named volume, then run nodemon (--legacy-watch handles
    # bind-mount file events). Deps are cached in the volume across restarts.
    command: sh -c "npm install && npm run start"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - s2s-net
    labels:
      traefik.enable: "true"
      traefik.http.routers.s2s-api-http.rule: "Host(`s2s-api.docker.localhost`)"
      traefik.http.routers.s2s-api-http.entrypoints: http
      traefik.http.routers.s2s-api-http.middlewares: https-redirect@file
      traefik.http.routers.s2s-api-https.rule: "Host(`s2s-api.docker.localhost`)"
      traefik.http.routers.s2s-api-https.entrypoints: https
      traefik.http.routers.s2s-api-https.tls: "true"
      traefik.http.services.s2s-api.loadbalancer.server.port: "3000"

networks:
  s2s-net:
    driver: bridge
    name: s2s-net

volumes:
  mongodb_data:
  backend_node_modules:
