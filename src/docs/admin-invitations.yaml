# @see src/routes/adminInvitation.js
tags:
  - name: AdminInvitations
    description: Admin invitation management

paths:
  /admin-invitations:
    post:
      summary: Send admin invitations by email
      tags: [AdminInvitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emails]
              properties:
                emails:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Invitations sent
    get:
      summary: Get all admin invitations
      tags: [AdminInvitations]
      responses:
        '200':
          description: List of invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminInvitation'
