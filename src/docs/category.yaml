# @see src/routes/categories.js
tags:
  - name: Categories
    description: Category management

paths:
  /categories:
    get:
      summary: Get categories
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: Filter categories by name
          example: Front
        - in: query
          name: sort
          schema:
            type: string
          description: Sort categories
          example: name
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
          description: Number of items to skip
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Maximum number of items to return
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  count:
                    type: integer
                    example: 3
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create a category
      description: Available only for users with Admin role.
      tags: [Categories]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Frontend
                appearance:
                  type: object
                  properties:
                    icon:
                      type: string
                      example: mocked-path-to-icon
                    color:
                      type: string
                      example: '#66C42C'
                totalOffers:
                  type: object
                  properties:
                    student:
                      type: integer
                      example: 0
                    tutor:
                      type: integer
                      example: 0
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Validation error or category already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /categories/names:
    get:
      summary: Get category names
      tags: [Categories]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Category names retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                      example: 665f1f77bcf86cd799439011
                    name:
                      type: string
                      example: Frontend
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
