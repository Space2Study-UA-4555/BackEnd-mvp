components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
        role:
          type: array
          items:
            type: string
            enum: [student, tutor, admin, superadmin]
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        photo:
          type: string
        professionalSummary:
          type: string
        nativeLanguage:
          type: string
          nullable: true
          enum: [English, Ukrainian, Polish, German, French, Spanish, Arabic]
        lastLogin:
          type: string
          format: date-time
        address:
          type: object
          properties:
            country:
              type: string
            city:
              type: string
        status:
          type: object
          properties:
            student:
              type: string
              enum: [active, blocked]
            tutor:
              type: string
              enum: [active, blocked]
            admin:
              type: string
              enum: [active, blocked]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthTokens:
      type: object
      description: refreshToken is sent as HttpOnly cookie, not in response body
      properties:
        accessToken:
          type: string

    Offer:
      type: object
      properties:
        _id:
          type: string
        price:
          type: number
        proficiencyLevel:
          type: string
          enum: [Beginner, Intermediate, Advanced, Test Preparation, Professional, Specialized]
        title:
          type: string
        description:
          type: string
        languages:
          type: array
          items:
            type: string
            enum: [English, Ukrainian, Polish, German, French, Spanish, Arabic]
        authorRole:
          type: string
          enum: [student, tutor]
        author:
          type: string
        status:
          type: string
          enum: [active, draft, closed]
        FAQ:
          type: array
          items:
            type: object
            properties:
              question:
                type: string
              answer:
                type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Question:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        text:
          type: string
        answers:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              isCorrect:
                type: boolean
        type:
          type: string
          enum: [multipleChoice, openAnswer, oneAnswer]
        category:
          type: string
        author:
          type: string
        resourceType:
          type: string
          enum: [lessons, attachments, questions, quizzes]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Lesson:
      type: object
      required:
        - title
        - description
        - author
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
        content:
          type: string
        attachments:
          type: array
          items:
            type: string
        category:
          type: string
          nullable: true
        author:
          type: string
        resourceType:
          type: string
          enum: [lessons, attachments, questions, quizzes]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LessonInput:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
        description:
          type: string
        content:
          type: string
        attachments:
          type: array
          items:
            type: string
        category:
          type: string
          nullable: true

    ResourcesCategory:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        author:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Category:
      type: object
      required:
        - name
      properties:
        _id:
          type: string
        name:
          type: string
          description: Unique category name
          example: Frontend
        appearance:
          type: object
          properties:
            icon:
              type: string
              example: mocked-path-to-icon
              default: mocked-path-to-icon
            color:
              type: string
              example: '#66C42C'
              default: '#66C42C'
        totalOffers:
          type: object
          properties:
            student:
              type: number
            tutor:
              type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Subject:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          description: Subject name
          example: English
        category:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Category'
        totalOffers:
          type: object
          properties:
            student:
              type: number
            tutor:
              type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminInvitation:
      type: object
      properties:
        _id:
          type: string
        email:
          type: string
        dateOfInvitation:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        status:
          type: number
        message:
          type: string

    Quiz:
      type: object
      required:
        - title
        - items
        - author
        - resourceType
      properties:
        _id:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 100
          example: 'JavaScript Basics Quiz'
        description:
          type: string
          maxLength: 150
          example: 'A quick quiz covering JS fundamentals.'
        items:
          type: array
          items:
            type: string
          description: 'Array of Question ObjectIds'
        author:
          type: string
          description: 'User ObjectId'
        category:
          type: string
          description: 'ResourcesCategory ObjectId'
        resourceType:
          type: string
          enum: [lessons, attachments, questions, quizzes]
          default: quizzes
        settings:
          type: object
          description: 'Additional quiz configuration settings'
          example: { 'allowRetake': true, 'showResults': 'afterSubmission' }
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
